<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>鹈鹕骑自行车</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#aee3f5 0%,#e8f7fd 60%,#f6e7c1 60%,#f0d9a0 100%)}
  .scene{position:relative;width:100%;height:100%}
  .sun{position:absolute;top:8%;left:12%;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle,#fff6b0 30%,#ffd93d 70%);box-shadow:0 0 60px 20px rgba(255,217,61,.55);
    animation:pulse 4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.9;animation:drift linear infinite}
  .c1{top:12%;width:140px;height:40px;animation-duration:38s}
  .c2{top:22%;width:100px;height:30px;animation-duration:55s;animation-delay:-20s}
  @keyframes drift{from{left:-15%}to{left:110%}}
  .ground{position:absolute;bottom:0;width:100%;height:40%;}
  .rider{position:absolute;bottom:24%;left:50%;transform:translateX(-50%);animation:bob .45s ease-in-out infinite}
  @keyframes bob{50%{transform:translateX(-50%) translateY(-4px)}}
  .wheel{transform-origin:center;animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .leg{transform-origin:top center;animation:pedal .6s linear infinite}
  @keyframes pedal{to{transform:rotate(360deg)}}
  .scenery{position:absolute;bottom:36%;width:100%;white-space:nowrap;animation:scroll 9s linear infinite}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-600px)}}
  .tree{display:inline-block;margin-right:90px}
  .speed{position:absolute;top:6%;right:4%;font:14px/1.6 "PingFang SC",sans-serif;color:#356;opacity:.75;text-align:right}
</style>
</head>
<body>
<div class="scene">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="scenery" id="scenery"></div>

  <svg class="rider" width="360" height="360" viewBox="0 0 360 360">
    <!-- 后轮 -->
    <g class="wheel" style="transform-box:fill-box;transform-origin:center">
      <circle cx="105" cy="285" r="48" fill="none" stroke="#234" stroke-width="7"/>
      <circle cx="105" cy="285" r="48" fill="none" stroke="#8ab" stroke-width="2" stroke-dasharray="6 10"/>
    </g>
    <!-- 前轮 -->
    <g class="wheel" style="transform-box:fill-box;transform-origin:center">
      <circle cx="255" cy="285" r="48" fill="none" stroke="#234" stroke-width="7"/>
      <circle cx="255" cy="285" r="48" fill="none" stroke="#8ab" stroke-width="2" stroke-dasharray="6 10"/>
    </g>
    <!-- 车架 -->
    <path d="M105 285 L165 195 L255 285 M165 195 L245 195 M105 285 L150 210 L165 195 M255 285 L245 195"
      fill="none" stroke="#d64545" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 车把/车座 -->
    <path d="M245 195 L262 160 M262 160 L280 165" fill="none" stroke="#234" stroke-width="7" stroke-linecap="round"/>
    <path d="M160 195 L172 190 L166 180 Z" fill="#234"/>
    <ellipse cx="163" cy="186" rx="14" ry="5" fill="#234"/>
    <!-- 牙盘与后飞轮 -->
    <g class="wheel" style="transform-box:fill-box;transform-origin:center;animation-duration:1.2s">
      <circle cx="170" cy="212" r="15" fill="none" stroke="#556" stroke-width="4"/>
      <circle cx="170" cy="212" r="5" fill="#334"/>
    </g>
    <g class="wheel" style="transform-box:fill-box;transform-origin:center;animation-duration:1.2s">
      <circle cx="105" cy="285" r="9" fill="none" stroke="#556" stroke-width="3"/>
    </g>
    <!-- 链条（上松下紧两段+流动虚线） -->
    <path d="M170 200 Q138 240 107 279" fill="none" stroke="#3a3a3a" stroke-width="3.5" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="0.25s" repeatCount="indefinite"/>
    </path>
    <path d="M170 224 Q140 260 108 291" fill="none" stroke="#2e2e2e" stroke-width="3.5" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="0.25s" repeatCount="indefinite"/>
    </path>
    <!-- 曲柄+腿（踩踏，与牙盘同轴170,212） -->
    <g class="leg" style="transform-box:fill-box;transform-origin:top center">
      <path d="M170 200 L152 232 L170 244" fill="none" stroke="#e8a33d" stroke-width="9" stroke-linecap="round"/>
      <circle cx="170" cy="244" r="6" fill="#c07f1f"/>
    </g>
    <g class="leg" style="transform-box:fill-box;transform-origin:top center;animation-delay:-.3s">
      <path d="M170 200 L186 228 L164 236" fill="none" stroke="#f3b95f" stroke-width="9" stroke-linecap="round"/>
      <circle cx="164" cy="236" r="6" fill="#c07f1f"/>
    </g>
    <!-- 鹈鹕身体 -->
    <ellipse cx="160" cy="120" rx="62" ry="46" fill="#fdfdfd" stroke="#d8d8d8" stroke-width="3"/>
    <!-- 尾羽 -->
    <path d="M100 108 Q70 100 62 118 Q85 122 98 128 Z" fill="#e9e9e9" stroke="#ccc" stroke-width="2"/>
    <!-- 翅膀（握车把方向） -->
    <path d="M195 112 Q245 118 268 156 Q235 150 205 138 Q192 126 195 112 Z" fill="#f3f3f3" stroke="#cfcfcf" stroke-width="3"/>
    <!-- 头颈（前伸） -->
    <path d="M195 92 Q245 70 272 82 Q282 88 278 96 Q250 88 210 105 Z" fill="#fdfdfd" stroke="#ddd" stroke-width="3"/>
    <circle cx="272" cy="80" r="24" fill="#fdfdfd" stroke="#ddd" stroke-width="3"/>
    <!-- 眼睛 -->
    <circle cx="280" cy="74" r="4.5" fill="#222"/>
    <circle cx="281.5" cy="72.5" r="1.5" fill="#fff"/>
    <!-- 大嘴（下方微张，骑行风感） -->
    <path d="M290 88 Q340 92 352 100 Q342 108 292 104 Z" fill="#f5a623" stroke="#d98b12" stroke-width="2"/>
    <path d="M292 96 Q330 98 344 101 L292 103 Z" fill="#e8930f"/>
    <!-- 颏囊 -->
    <path d="M288 102 Q300 122 276 118 Q272 106 288 102 Z" fill="#f7bd5c"/>
    <!-- 小围巾（飘） -->
    <path d="M186 100 Q160 108 138 102 Q158 116 186 112 Z" fill="#e05252">
      <animate attributeName="d" dur="0.5s" repeatCount="indefinite"
        values="M186 100 Q160 108 138 102 Q158 116 186 112 Z;
                M186 100 Q158 104 132 112 Q156 114 186 112 Z;
                M186 100 Q160 108 138 102 Q158 116 186 112 Z"/>
    </path>
  </svg>

  <div class="speed">🚴 鹈鹕骑行中<br>时速 18 km/h</div>
</div>
<script>
  // 循环生成路旁树木
  const sc=document.getElementById('scenery');
  const treeSVG=`<span class="tree"><svg width="70" height="90" viewBox="0 0 70 90">
    <rect x="31" y="55" width="8" height="35" fill="#8a5a2b"/>
    <circle cx="35" cy="38" r="26" fill="#4e9b47"/>
    <circle cx="20" cy="48" r="16" fill="#3f8a3a"/>
    <circle cx="50" cy="48" r="16" fill="#5fae57"/></svg></span>`;
  for(let i=0;i<20;i++) sc.insertAdjacentHTML('beforeend',treeSVG);
</script>
</body>
</html>
